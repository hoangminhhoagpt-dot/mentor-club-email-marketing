# DỰNG BÁO CÁO (12.10 + 12.11): gộp số liệu 12.1→12.9 thành bảng đọc được.
# Chỉ ĐỌC và ghi vào 2 bảng báo cáo — không gửi email, chạy lúc nào cũng an toàn.
# Chạy:
#   1. Từ Lark  — POST .../dispatches  body: {"event_type":"build-report"}
#                 (nên đặt lịch Lark Automation chạy sau lần gửi hằng ngày)
#   2. Bấm tay  — Actions → build-report → Run workflow.
#
# KHÔNG có giá trị mặc định — mọi thứ đến từ Variables của CHÍNH BẠN.
name: build-report

on:
  repository_dispatch:
    types: [build-report]
  workflow_dispatch:

concurrency:
  group: build-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Dựng báo cáo
        env:
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_ID:     ${{ vars.LARK_APP_ID }}
          LARK_APP_TOKEN:  ${{ vars.LARK_APP_TOKEN }}
          TABLE_NURTURE:  ${{ vars.TABLE_NURTURE }}
          TABLE_CAMPAIGN: ${{ vars.TABLE_CAMPAIGN }}
          TABLE_NL_LIST:  ${{ vars.TABLE_NL_LIST }}
          TABLE_NL_MAIL:  ${{ vars.TABLE_NL_MAIL }}
          TABLE_OPEN:     ${{ vars.TABLE_OPEN }}
          TABLE_UNSUB:    ${{ vars.TABLE_UNSUB }}
          TABLE_FAKE:     ${{ vars.TABLE_FAKE }}
          TABLE_ERROR:    ${{ vars.TABLE_ERROR }}
          TABLE_CLICK:    ${{ vars.TABLE_CLICK }}
          TABLE_REPORT:   ${{ vars.TABLE_REPORT }}
          TABLE_DAILY:    ${{ vars.TABLE_DAILY }}
        run: node scripts/build-report.mjs
