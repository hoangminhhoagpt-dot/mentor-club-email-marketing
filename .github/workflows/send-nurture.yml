# Gửi chiến dịch NUÔI DƯỠNG 365 ngày (12.1 + 12.2).
# KHÔNG dùng cron trên GitHub — chỉ chạy khi được gọi từ Lark Base (HTTP) hoặc bấm tay.
# Chạy:
#   1. Từ Lark  — automation gọi HTTP: POST https://api.github.com/repos/<user>/<repo>/dispatches
#                 body: {"event_type":"send-nurture"}   (đặt lịch chạy hằng ngày bằng Lark Automation)
#   2. Bấm tay  — tab Actions → send-nurture → Run workflow.
name: send-nurture

on:
  repository_dispatch:
    types: [send-nurture]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = chỉ mô phỏng, không gửi thật"
        required: false
        default: "false"

# Hai lượt gửi chạy đè nhau sẽ đọc cùng một "Bước gần nhất" và gửi trùng cho cùng một người.
# Khoá này bắt lượt sau xếp hàng chờ, KHÔNG huỷ — huỷ là mất lượt gửi của ngày hôm đó.
concurrency:
  group: send-nurture
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Gửi email nuôi dưỡng
        env:
          # ---- BÍ MẬT → GitHub Secrets ----
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          SMTP_PASS:       ${{ secrets.SMTP_PASS }}
          # ---- KHÔNG bí mật → Variables (client_payload ghi đè, có default sẵn) ----
          # KHÔNG có giá trị mặc định: mọi thứ phải đến từ Variables của CHÍNH BẠN.
          # Thiếu biến nào thì script dừng và nói thiếu gì — thà đỏ còn hơn chạy nhầm vào base người khác.
          LARK_APP_ID:    ${{ vars.LARK_APP_ID }}
          LARK_APP_TOKEN: ${{ vars.LARK_APP_TOKEN }}
          TABLE_NURTURE:  ${{ github.event.client_payload.table_nurture  || vars.TABLE_NURTURE }}
          TABLE_CAMPAIGN: ${{ github.event.client_payload.table_campaign || vars.TABLE_CAMPAIGN }}
          TABLE_UNSUB:    ${{ vars.TABLE_UNSUB }}
          TABLE_ERROR:    ${{ vars.TABLE_ERROR }}
          TABLE_FAKE:     ${{ vars.TABLE_FAKE }}
          SMTP_HOST:       ${{ vars.SMTP_HOST || 'smtp.larksuite.com' }}
          SMTP_USER:       ${{ vars.SMTP_USER }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL || vars.SMTP_USER }}
          SMTP_FROM_NAME:  ${{ vars.SMTP_FROM_NAME }}
          TRACKER_BASE_URL: ${{ vars.TRACKER_BASE_URL }}
          SEND_PER_RUN_LIMIT: ${{ vars.SEND_PER_RUN_LIMIT || '400' }}
          SEND_DELAY_MS:      ${{ vars.SEND_DELAY_MS || '4000' }}
          DRY_RUN: ${{ github.event.client_payload.dry_run || inputs.dry_run || 'false' }}
        run: node scripts/send-nurture.mjs
