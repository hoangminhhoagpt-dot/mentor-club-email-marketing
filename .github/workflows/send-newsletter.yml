# Gửi EMAIL BẢNG TIN (12.3 + 12.4).
# Chạy:
#   1. Bấm tay  — tab Actions → send-newsletter → Run workflow (điền record_id nếu muốn gửi 1 dòng).
#   2. Qua HTTP — POST https://api.github.com/repos/<user>/<repo>/dispatches
#      body: {"event_type":"send-newsletter","client_payload":{"record_id":"recXXXX"}}
#      (dùng cho NÚT BẤM trong Lark: tick 1 dòng 12.4 → gọi HTTP kèm record_id — xem docs/05)
#   Không truyền record_id → gửi mọi dòng 12.4 trạng thái "Chờ gửi" (đến lịch).
name: send-newsletter

on:
  repository_dispatch:
    types: [send-newsletter]
  workflow_dispatch:
    inputs:
      record_id:
        description: "record_id của 1 dòng 12.4 (bỏ trống = gửi mọi dòng 'Chờ gửi')"
        required: false

# Hai lượt gửi chạy đè nhau sẽ đọc cùng một con trỏ "Đã gửi" và bắn trùng nửa danh sách.
# Xếp hàng chờ chứ không huỷ — huỷ giữa chừng là bản tin gửi dở dang.
concurrency:
  group: send-newsletter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Gửi email bảng tin
        env:
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          SMTP_PASS:       ${{ secrets.SMTP_PASS }}
          # KHÔNG có giá trị mặc định: mọi thứ phải đến từ Variables của CHÍNH BẠN.
          # Thiếu biến nào thì script dừng và nói thiếu gì — thà đỏ còn hơn chạy nhầm vào base người khác.
          LARK_APP_ID:    ${{ vars.LARK_APP_ID }}
          LARK_APP_TOKEN: ${{ vars.LARK_APP_TOKEN }}
          TABLE_NL_MAIL: ${{ github.event.client_payload.table_nl_mail || vars.TABLE_NL_MAIL }}
          TABLE_NL_LIST: ${{ github.event.client_payload.table_nl_list || vars.TABLE_NL_LIST }}
          TABLE_UNSUB:   ${{ vars.TABLE_UNSUB }}
          TABLE_ERROR:   ${{ vars.TABLE_ERROR }}
          TABLE_FAKE:    ${{ vars.TABLE_FAKE }}
          SMTP_HOST:       ${{ vars.SMTP_HOST || 'smtp.larksuite.com' }}
          SMTP_USER:       ${{ vars.SMTP_USER }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL || vars.SMTP_USER }}
          SMTP_FROM_NAME:  ${{ vars.SMTP_FROM_NAME }}
          TRACKER_BASE_URL: ${{ vars.TRACKER_BASE_URL }}
          SEND_PER_RUN_LIMIT: ${{ vars.SEND_PER_RUN_LIMIT || '400' }}
          SEND_DELAY_MS:      ${{ vars.SEND_DELAY_MS || '4000' }}
          RECORD_ID: ${{ github.event.client_payload.record_id || inputs.record_id }}
        run: node scripts/send-newsletter.mjs
