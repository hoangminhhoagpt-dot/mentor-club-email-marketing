# ============================================================================
# itto.yaml — HỢP ĐỒNG ITTO của gói mentor-club-email-marketing (11 bảng 12.1→12.11)
# Buộc chặt: Skill (hmh-AIOS-email-marketing) ⇄ Repo này ⇄ Base Mẫu 11 bảng.
# Máy đọc: scripts/check-setup.mjs soát 4 mục + danh sách secret dưới đây.
# ============================================================================

package: mentor-club-email-marketing
version: 1.1.0                     # 1.1.0 — Base Mẫu THẬT (mảnh ③) đã dựng; setup-tables biết đẻ bảng
skill: hmh-AIOS-email-marketing

# ── I — INPUT: chuẩn bị TRƯỚC khi chạy ──
input:
  base_mau:
    # ★ MẪU CHUẨN (chốt 06/08/2026): base "MENTOR CAMP CRM" — mọi cấu hình mặc định của repo,
    #   Worker và workflow đều trỏ về đây. Base cũ ZM8qbz78… và GWQgbY7t… KHÔNG dùng nữa.
    #   Quyền cần đặt: ai có link XEM + TẠO BẢN SAO. Học viên: mở link → "..." → "Tạo bản sao".
    #   11 bảng 12.x sinh 100% từ setup-tables.mjs — KHÔNG sửa cột bằng tay trên UI.
    #   Base còn chứa các bảng nghiệp vụ khác của Mentor Club (2.x SEO, 14.x Facebook, CSKH…);
    #   setup-tables chỉ đụng vào bảng tên "12.x", không động tới phần còn lại.
    template_url: "https://studiosuccess.sg.larksuite.com/base/TxSrb3qKeaMqZDslH9Uln3yzgyb"
    app_token: "TxSrb3qKeaMqZDslH9Uln3yzgyb"   # base MẪU CHUẨN "MENTOR CAMP CRM" — app_token KHÔNG phải bí mật, vào được vẫn phải có app secret
    setup: node scripts/setup-tables.mjs --base <app_token-cua-ban-sao>   # đẻ bảng thiếu + bù cột
    tables:
      - "12.1 Danh sách Email Nuôi Dưỡng"
      - "12.2 Chiến dịch Email 365 ngày"
      - "12.3 Danh sách Email bảng tin"
      - "12.4 Email bảng tin"
      - "12.5 Báo cáo đọc Email"
      - "12.6 Huỷ nhận email"
      - "12.7 Lọc mail ảo"
      - "12.8 Danh sách mail lỗi"
      - "12.9 Danh sách email click link"
      - "12.10 Báo cáo chiến dịch"          # máy ghi — dựng bởi build-report.mjs
      - "12.11 Tổng quan theo ngày"         # máy ghi — mỗi ngày 1 dòng, để vẽ xu hướng
  secrets:                       # BÍ MẬT — GitHub Secrets (hoặc config.local.json khi chạy máy)
    - LARK_APP_SECRET            # App Secret của app Lark
    - SMTP_PASS                  # IMAP/SMTP password của Lark Mail
  variables:                     # KHÔNG bí mật — GitHub Variables
    - TRACKER_BASE_URL           # URL Cloudflare Worker (tracking mở/click/huỷ)
  phieu_input: docs/00-PHIEU-INPUT.md
  preflight: node check-itto.mjs && node scripts/check-setup.mjs   # cả 2 PHẢI xanh mới chạy thật
  # check-itto.mjs: zero-dep, soát hợp đồng — chạy được ngay cả khi chưa `npm install`.
  # check-setup.mjs: cần npm install + Lark/SMTP sống (soát quyền, 11 bảng, đăng nhập mail).

# ── T — TECH ──
tech:
  - Lark Base
  - Lark Mail SMTP (smtp.larksuite.com)
  - Lark Mail IMAP (imap.larksuite.com)
  - Cloudflare Worker (/o mở · /c click · /u huỷ)
  - GitHub Actions

# ── T — TOOL: 4 điểm bấm (HTTP repository_dispatch) ──
tool:
  setup: node scripts/setup-tables.mjs
  triggers:
    - event_type: send-newsletter
      script: node scripts/send-newsletter.mjs
      desc: "Gửi bản tin 12.4 → 12.3 (theo nút 'Gửi ngay' hoặc lịch)"
    - event_type: send-nurture
      script: node scripts/send-nurture.mjs
      desc: "Gửi drip 365 ngày 12.2 → 12.1 (lịch 08:00 mỗi ngày)"
    - event_type: filter-fake
      script: node scripts/filter-fake.mjs
      desc: "Lọc mail ảo (cú pháp/MX/disposable) → 12.7"
    - event_type: sync-bounces
      script: node scripts/sync-bounces.mjs
      desc: "Quét bounce qua IMAP → 12.8 (suppression)"
    - event_type: build-report
      script: node scripts/build-report.mjs
      desc: "Gộp 12.1→12.9 thành báo cáo 12.10 + ảnh chụp ngày 12.11 (chỉ đọc, an toàn)"

# ── O — OUTPUT: kết quả rơi vào đâu, kiểm bằng gì ──
output:
  writes_back:
    - "12.5 Báo cáo đọc (Worker /o)"
    - "12.9 Click link (Worker /c)"
    - "12.6 Huỷ nhận (Worker /u)"
    - "12.8 Bounce (sync-bounces IMAP)"
    - "12.10 Báo cáo chiến dịch + 12.11 Tổng quan ngày (build-report)"
    - "12.4 Trạng thái/Đã gửi (send-newsletter)"
    - "12.1 Bước gần nhất/Lần gửi (send-nurture)"
  proof: "tab Actions xanh + số liệu ghi vào 12.5/12.6/12.8/12.9"
  report: "(tuỳ chọn) card báo cáo nhóm Lark"
